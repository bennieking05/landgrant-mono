# ------------------------------------------------------------------------------
# Cloud Build Configuration for LandGrant
# Builds and deploys both backend API and frontend
# ------------------------------------------------------------------------------

# Use substitution defaults for Artifact Registry and GCS, or override `_PROJECT_ID`
# (and optionally `_FRONTEND_BUCKET`) so they match `gcloud builds submit --project=...`.
substitutions:
  _REGION: us-central1
  _PROJECT_ID: clearpath-490715
  _API_IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/landgrant/api
  _WORKER_IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/landgrant/worker
  _MARKETING_IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/landgrant/marketing
  # Default matches many installs; must equal the GCS bucket behind the LB (terraform output frontend_bucket).
  _FRONTEND_BUCKET: ${_PROJECT_ID}-frontend
  # Terraform google_compute_url_map.frontend name; set _CDN_INVALIDATE to "0" to skip.
  _FRONTEND_URL_MAP: landgrant-frontend-urlmap
  _CDN_INVALIDATE: "1"

steps:
  # ------------------------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------------------------
  - id: 'build-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_API_IMAGE}:$COMMIT_SHA'
      - '-t'
      - '${_API_IMAGE}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  - id: 'push-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_API_IMAGE}'
    waitFor: ['build-api']

  - id: 'deploy-api'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'landgrant-api'
      - '--region=${_REGION}'
      - '--image=${_API_IMAGE}:$COMMIT_SHA'
    waitFor: ['push-api']

  # Canonical HTTPS URL for the API revision (avoids stale regional *.run.app hostnames).
  - id: 'resolve-api-url'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run services describe landgrant-api \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --format='value(status.url)' > /workspace/vite_api_base.txt
        test -s /workspace/vite_api_base.txt
    waitFor: ['deploy-api']

  # ------------------------------------------------------------------------------
  # Backend Worker
  # ------------------------------------------------------------------------------
  - id: 'build-worker'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_WORKER_IMAGE}:$COMMIT_SHA'
      - '-t'
      - '${_WORKER_IMAGE}:latest'
      - '-f'
      - 'backend/Dockerfile.worker'
      - '.'

  - id: 'push-worker'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_WORKER_IMAGE}'
    waitFor: ['build-worker']

  - id: 'deploy-worker'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'landgrant-worker'
      - '--region=${_REGION}'
      - '--image=${_WORKER_IMAGE}:$COMMIT_SHA'
    waitFor: ['push-worker']

  # ------------------------------------------------------------------------------
  # Marketing Site
  # ------------------------------------------------------------------------------
  - id: 'build-marketing'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_MARKETING_IMAGE}:$COMMIT_SHA'
      - '-t'
      - '${_MARKETING_IMAGE}:latest'
      - '-f'
      - 'marketing/Dockerfile'
      - 'marketing'

  - id: 'push-marketing'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_MARKETING_IMAGE}'
    waitFor: ['build-marketing']

  - id: 'deploy-marketing'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'landgrant-marketing'
      - '--region=${_REGION}'
      - '--image=${_MARKETING_IMAGE}:$COMMIT_SHA'
    waitFor: ['push-marketing']

  # ------------------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------------------
  - id: 'install-frontend'
    name: 'node:20-slim'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - id: 'build-frontend'
    name: 'node:20-slim'
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        export VITE_API_BASE="$(tr -d '\r\n' < /workspace/vite_api_base.txt)"
        test -n "$$VITE_API_BASE"
        npm run build
    waitFor: ['install-frontend', 'resolve-api-url']

  - id: 'deploy-frontend'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gsutil'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - 'frontend/dist'
      - 'gs://${_FRONTEND_BUCKET}'
    waitFor: ['build-frontend']

  # Set cache headers for static assets
  - id: 'set-cache-headers'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" \
          "gs://${_FRONTEND_BUCKET}/assets/**"
        gsutil -m setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
          "gs://${_FRONTEND_BUCKET}/index.html"
    waitFor: ['deploy-frontend']

  # Cloud CDN may still serve old hashed chunks until invalidated (common "UX not updating" cause).
  - id: 'invalidate-frontend-cdn'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_CDN_INVALIDATE}" != "1" ] || [ -z "${_FRONTEND_URL_MAP}" ]; then
          echo "Skipping CDN invalidation (_CDN_INVALIDATE=${_CDN_INVALIDATE}, _FRONTEND_URL_MAP set?)"
          exit 0
        fi
        set +e
        gcloud compute url-maps invalidate-cdn-cache "${_FRONTEND_URL_MAP}" \
          --path='/*' --global --project="${_PROJECT_ID}" --async
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "WARN: CDN invalidation failed (exit $rc). GCS has new files; edge cache may be stale until TTL."
          echo "Fix IAM (compute.urlMaps.invalidateCache for the Cloud Build SA) or run manually:"
          echo "  gcloud compute url-maps invalidate-cdn-cache ${_FRONTEND_URL_MAP} --path='/*' --global --project=${_PROJECT_ID}"
        else
          echo "CDN invalidation requested for URL map ${_FRONTEND_URL_MAP} (async)."
        fi
    waitFor: ['set-cache-headers']

images:
  - '${_API_IMAGE}:$COMMIT_SHA'
  - '${_API_IMAGE}:latest'
  - '${_WORKER_IMAGE}:$COMMIT_SHA'
  - '${_WORKER_IMAGE}:latest'
  - '${_MARKETING_IMAGE}:$COMMIT_SHA'
  - '${_MARKETING_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'

timeout: '1800s'  # 30 minutes
