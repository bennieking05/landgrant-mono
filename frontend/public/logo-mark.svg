<?xml version="1.0" encoding="UTF-8"?>
<!-- LandGrantIQ mark (Logo Option 1): hook bracket + 3x3 pixel grid with copper "IQ" accent dot.
     Reconstructed to match the approved Logo Option 1 PDF; navy #14294A, copper #B26A2C. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="lgiq-mark-title">
  <title id="lgiq-mark-title">LandGrantIQ</title>
  <g transform="translate(1,10)">
    <g fill="#14294A">
      <!-- hook bracket -->
      <path d="M3 4 h17 v8 h-9 v28 h-8 z"/>
      <!-- 3x3 grid -->
      <rect x="24" y="4" width="9" height="9" rx="1.5"/>
      <rect x="37" y="4" width="9" height="9" rx="1.5"/>
      <rect x="50" y="4" width="9" height="9" rx="1.5"/>
      <rect x="24" y="17" width="9" height="9" rx="1.5"/>
      <rect x="37" y="17" width="9" height="9" rx="1.5"/>
      <rect x="24" y="30" width="9" height="9" rx="1.5"/>
      <rect x="37" y="30" width="9" height="9" rx="1.5"/>
      <rect x="50" y="30" width="9" height="9" rx="1.5"/>
    </g>
    <circle cx="54.5" cy="21.5" r="4.7" fill="#B26A2C"/>
  </g>
</svg>
